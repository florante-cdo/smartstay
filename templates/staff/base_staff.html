{% extends "base.html" %}

{% block content %}
<div class="border-b border-garden-900/10 bg-white">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-6 py-3">
    <nav class="flex flex-wrap items-center gap-5 text-sm font-medium">
      <a href="{% url 'staff_home' %}" class="font-display text-lg font-semibold">Starwood Gardens · Staff</a>
      <a href="{% url 'staff_inbox' %}"
         class="{% if nav == 'inbox' %}text-garden-600 underline underline-offset-4{% else %}hover:text-garden-600{% endif %}">Inbox</a>
    </nav>
    <div class="flex items-center gap-4 text-sm">
      <span>{{ request.user.get_full_name|default:request.user.username }}</span>
      <span class="rounded-full bg-garden-100 px-2.5 py-0.5 font-medium capitalize text-garden-700">{{ role }}</span>
      <form method="post" action="{% url 'staff_logout' %}">
        {% csrf_token %}
        <button type="submit" class="font-medium text-garden-600 hover:text-garden-900">Sign out</button>
      </form>
    </div>
  </div>
</div>
<main class="mx-auto max-w-6xl px-6 py-8">
  {% block staff_content %}{% endblock %}
</main>
{% endblock %}
